name: line_sticker_app
description: "自動化 LINE 貼圖裁切與規格處理系統 Flutter 前端"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client for communicating with the Python backend
  http: ^1.2.1

  # File picker – lets the user pick images from disk/gallery
  file_picker: ^8.0.3

  # Display images from bytes in memory
  flutter_image_compress: ^2.1.0

  # Progress indicator & status handling
  provider: ^6.1.2

  # Save files / share ZIP output
  path_provider: ^2.1.3
  share_plus: ^9.0.0

  # Drag-and-drop image grid (sticker preview)
  reorderable_grid_view: ^2.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
